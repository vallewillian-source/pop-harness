[package]
name = "poph-plugins"
description = "Supervisão de plugins de integração em processo externo do POP Harness: protocolo JSON-lines sobre stdio, handshake, timeout, reinício com backoff e isolamento entre integrações (HR-25)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
poph-types = { path = "../poph-types" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.54", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber.workspace = true

[[bin]]
name = "plugin-fixtura"
path = "tests/fixtures/plugin_fixtura.rs"

[lints]
workspace = true
