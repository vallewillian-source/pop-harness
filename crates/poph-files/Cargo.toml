[package]
name = "poph-files"
description = "Arquivos do POP Harness (HR-23): recebimento com limite de tamanho, tipo real pelo conteúdo, blob por hash, imagens como partes do LLM e texto de PDF/Office extraído em processo isolado com limite de tempo e memória."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "poph-extrator"
path = "src/bin/poph-extrator.rs"

[dependencies]
poph-types = { path = "../poph-types" }
infer = "0.22"
pdf-extract = "0.12"
calamine = "0.38"
zip = { version = "9.7", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
sha2 = "0.11"
rlimit = "0.11"
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
