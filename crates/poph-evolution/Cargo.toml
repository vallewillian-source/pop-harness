[package]
name = "poph-evolution"
description = "Cliente HTTP da EvolutionAPI (WhatsApp) no POP Harness: as operações da instância, envio de texto e de arquivo, download de mídia recebida e o manifesto do canal (HR-26a)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
poph-types = { path = "../poph-types" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
base64 = "0.23"
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.54", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-rustls = "0.26"

[lints]
workspace = true
