[package]
name = "poph-plugin-eco"
description = "Plugin de exemplo (eco) do POP Harness: implementa o protocolo JSON-lines sobre stdio e devolve o texto invertido como evento de entrada. Serve de modelo para novos plugins (HR-27)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Os tipos do protocolo são os mesmos que o Harness usa: se o contrato mudar, este exemplo não
# compila. Um plugin em outra linguagem troca isto pelo JSON de `docs/PLUGIN_PROTOCOLO.md`.
poph-types = { path = "../poph-types" }
serde_json.workspace = true

[dev-dependencies]
poph-agent = { path = "../poph-agent" }
poph-plugins = { path = "../poph-plugins" }
poph-store = { path = "../poph-store" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }

# O plugin: lê o protocolo na entrada padrão e responde na saída padrão.
[[bin]]
name = "plugin-eco"
path = "src/main.rs"

# Demonstração de ponta a ponta (outbox → plugin → inbox) usada por `scripts/plugin-eco.sh`.
# É um `example` de propósito: ele usa o motor (`poph-agent`) só nas dependências de teste, então o
# binário do plugin continua leve e sem arrastar SQLite/RAG para quem for escrever um plugin.
[[example]]
name = "plugin-eco-demo"
path = "src/demo.rs"

[lints]
workspace = true
