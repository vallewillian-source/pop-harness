[package]
name = "poph-matrix"
description = "POP Harness Matrix module: mirrors conversations into Synapse rooms and delivers the human attendant response (MX-07, MX-09)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
poph-types = { path = "../poph-types" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54", features = ["time"] }
futures = "0.3"
tracing.workspace = true

[dev-dependencies]
poph-files = { path = "../poph-files" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
