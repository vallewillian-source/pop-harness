[package]
name = "poph"
description = "POP Harness: binário único (CLI e servidor)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
clap.workspace = true
poph-agent = { path = "../poph-agent" }
poph-core = { path = "../poph-core" }
poph-files = { path = "../poph-files" }
poph-flows = { path = "../poph-flows" }
poph-jev = { path = "../poph-jev" }
poph-matrix = { path = "../poph-matrix" }
poph-rag = { path = "../poph-rag" }
poph-retention = { path = "../poph-retention" }
poph-server = { path = "../poph-server" }
poph-store = { path = "../poph-store" }
poph-types = { path = "../poph-types" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "signal", "macros", "net", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
rusqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
axum = { version = "0.8", features = ["macros"] }
