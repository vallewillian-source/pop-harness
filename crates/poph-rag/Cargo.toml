[package]
name = "poph-rag"
description = "RAG do POP Harness: embedding local (ONNX Runtime, int8), fila com lote e limite por org, e instalação do modelo. Único crate com FFI do embedding (D-08, D-09)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
poph-types = { path = "../poph-types" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-31", "tracing", "download-binaries", "tls-rustls"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11"
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.54", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
