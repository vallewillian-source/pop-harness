[package]
name = "poph-jev"
description = "Jev (TypeSafe System One) no POP Harness: cliente HTTP, framework de gates, lote único de perguntas e cache de decisão (HR-28)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
poph-types = { path = "../poph-types" }
futures = "0.3"
# HR-10b: TLS com a feature `rustls` (a mesma do cliente do LLM e do `poph-rag`). O Jev real é
# https (`https://api.typesafe.ai`); o gateway local em http continua aceito. Por compilar C, o
# `cargo check` aarch64 da estação não cobre mais este crate (D-16).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.54", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# Servidor TLS local dos testes de https (certificado de fixtura em tests/fixtures/tls).
rustls = "0.23"

[lints]
workspace = true
