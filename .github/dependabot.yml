# O Console (console/) fica de fora: ele depende de @sofacoding/sofa-ui por caminho local e não tem
# lockfile publicado. Quando o pacote estiver no npm, acrescente o ecossistema npm.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
