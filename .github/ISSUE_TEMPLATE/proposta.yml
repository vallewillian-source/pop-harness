name: Proposal
description: Suggest an improvement or a new feature.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Open the proposal **before** writing the code, especially if it touches an API contract, a file
        format, the database schema or the design of a module. See also `ROADMAP.md`.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve
      description: Describe the real situation, without jumping to the solution. Who is affected and what do they do today to work around it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose
      description: What changes in practice for whoever uses it. If you know, say what the command, route or configuration would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing" and workarounds that already work.
  - type: textarea
    id: costs
    attributes:
      label: Costs and risks
      description: Memory, a new dependency, compatibility with what exists, isolation between orgs, security.
  - type: dropdown
    id: contribute
    attributes:
      label: Can you implement it?
      options:
        - Yes, I'll open the pull request after we agree
        - I can help with part of it
        - No, I'm only suggesting
    validations:
      required: true
