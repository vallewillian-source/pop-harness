name: Erro
description: Algo não funciona como a documentação diz.
labels: ["bug", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. **Não cole** chaves, tokens, `POPH_CHAVE_CIFRA`, telefones nem conversas reais de clientes.
        Falha de segurança **não** vai aqui: veja o `SECURITY.md`.
  - type: textarea
    id: o-que-acontece
    attributes:
      label: O que acontece
      description: Descreva o que você viu e o que esperava ver.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para reproduzir
      description: Comandos, chamadas de API ou cliques, na ordem. Quanto menor o exemplo, melhor.
      placeholder: |
        1. `poph --config poph.toml ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: saida
    attributes:
      label: Saída e logs
      description: Mensagem de erro completa e o trecho de log relevante, sem segredos. Rode com `RUST_LOG=debug` se ajudar.
      render: text
  - type: input
    id: versao
    attributes:
      label: Versão
      description: Saída de `poph --version` e, se compilou do código, o commit.
      placeholder: poph 0.1.0 (commit abc1234)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Turno do agente
        - Base de conhecimento e busca
        - Produtos e carrinho
        - Arquivos
        - Jev
        - WhatsApp (EvolutionAPI)
        - Plugins de canal
        - Fluxos e Fichas
        - Matrix e Element
        - API administrativa
        - Console
        - CLI
        - Cluster, backup ou retenção
        - Build, CI ou documentação
        - Não sei
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Sistema operacional, arquitetura (x86_64 ou ARM64), `poph doctor` (sem segredos) e as seções relevantes do `poph.toml`.
      render: text
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Antes de enviar
      options:
        - label: Procurei nas issues abertas e fechadas e não achei o mesmo problema.
          required: true
        - label: Reproduzi na versão mais recente.
          required: false
        - label: Removi segredos e dados de clientes do que colei aqui.
          required: true
