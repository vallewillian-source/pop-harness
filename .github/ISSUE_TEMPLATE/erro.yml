name: Bug report
description: Something does not work the way the documentation says.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste** keys, tokens, `POPH_CHAVE_CIFRA`, phone numbers or real customer conversations.
        Security flaws do **not** go here: see `SECURITY.md`.
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe what you saw and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, API calls or clicks, in order. The smaller the example, the better.
      placeholder: |
        1. `poph --config poph.toml ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and logs
      description: The full error message and the relevant log excerpt, without secrets. Run with `RUST_LOG=debug` if it helps.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `poph --version` and, if you built from source, the commit.
      placeholder: poph 0.1.0 (commit abc1234)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent turn
        - Knowledge base and search
        - Products and cart
        - Files
        - Jev
        - WhatsApp (EvolutionAPI)
        - Channel plugins
        - Flows and Fichas
        - Matrix and Element
        - Admin API
        - Console
        - CLI
        - Cluster, backup or retention
        - Build, CI or documentation
        - I don't know
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture (x86_64 or ARM64), `poph doctor` output (no secrets) and the relevant sections of `poph.toml`.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and did not find the same problem.
          required: true
        - label: I reproduced it on the latest version.
          required: false
        - label: I removed secrets and customer data from what I pasted here.
          required: true
