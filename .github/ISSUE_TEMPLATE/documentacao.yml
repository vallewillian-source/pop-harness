name: Documentation
description: Something is wrong, missing or confusing in the documentation.
labels: ["documentation", "triage"]
body:
  - type: input
    id: where
    attributes:
      label: Where it is
      description: File and section, or the link.
      placeholder: docs/CONFIGURACAO.md, section "Segredos"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: How it should be
      description: If you already have the text, even better. Documentation pull requests are very welcome.
